{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация</title>
    <link href="{% static 'webapp/css/bootstrap.min.css' %}" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card shadow-sm">
                    <div class="card-body p-4">
                        <h3 class="card-title text-center mb-4">Регистрация</h3>
                        
                        <form method="post">
                            {% csrf_token %}
                            
                            {% for field in form %}
                                <div class="mb-3">
                                    <label for="{{ field.id_for_label }}" class="form-label">{{ field.label }}</label>
                                    <input type="{{ field.field.widget.input_type }}" 
                                           name="{{ field.html_name }}" 
                                           class="form-control" 
                                           id="{{ field.id_for_label }}" 
                                           required>
                                    {% if field.help_text %}
                                        <div class="form-text text-muted small">{{ field.help_text }}</div>
                                    {% endif %}
                                </div>
                            {% endfor %}
                            
                            <button type="submit" class="btn btn-success w-100">Зарегистрироваться</button>
                        </form>
                        
                        <div class="text-center mt-3">
                            <a href="{% url 'login' %}" class="small">Уже есть профиль? Войти</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="{% static 'webapp/js/bootstrap.bundle.min.js' %}"></script>
</body>
</html>
