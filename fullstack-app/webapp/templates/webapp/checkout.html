{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Оформление заказа</title>
    <link href="{% static 'webapp/css/bootstrap.min.css' %}" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <h1 class="mb-4">Оформление заказа</h1>
        <div class="row">
            <div class="col-md-8">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h5 class="card-title">Детали заказа</h5>
                        <p>Сумма к оплате: <strong>{{ order.get_total_cost }} руб.</strong></p>
                        <form method="post">
                            {% csrf_token %}
                            <button type="submit" class="btn btn-primary btn-lg">Подтвердить и оплатить</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="{% static 'webapp/js/bootstrap.bundle.min.js' %}"></script>
</body>
</html>
